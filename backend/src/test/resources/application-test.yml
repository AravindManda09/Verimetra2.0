spring:
  datasource:
    url: jdbc:h2:mem:verimetra_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

verimetra:
  ocr:
    service-url: http://localhost:8090
  evidence:
    storage-path: ./test-evidence
